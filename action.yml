name: 'CPG Nuclei Compiler Verification Harness'
description: 'Deterministic Joern CPG-to-Nuclei YAML compiler & Docker verification harness for non-destructive refactoring.'
author: 'Tito0015'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  template:
    description: 'Path to the target Nuclei template YAML'
    required: true
  target:
    description: 'Target URL for local harness testing (e.g., http://127.0.0.1:5000)'
    required: false
    default: 'http://127.0.0.1:5000'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Docker Verification Harness
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_TEMPLATE: ${{ inputs.template }}
        INPUT_TARGET: ${{ inputs.target }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail
        template_path="${INPUT_TEMPLATE}"
        if [[ "${template_path}" != /* ]]; then
          template_path="${GITHUB_WORKSPACE}/${template_path}"
        fi
        python3 -m harness.docker_runner --template "${template_path}" --target "${INPUT_TARGET}"
